<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Starlink Reseller Kenya</title>
    <meta name="description" content="Log in to your Starlink Reseller Kenya account to manage bundles and orders.">
    <link rel="icon" type="image/png" href="https://www.starlink.com/favicon.ico">
    <link rel="manifest" href="/starlink/manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Starlink KE">
    <link rel="apple-touch-icon" href="/starlink/icons/icon-192.png">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="/starlink/pwa-install.js" defer></script>
    <script src="/starlink/assets/app.js" defer></script>
    <style>
        .card-shadow { box-shadow: 0 4px 24px rgba(0,0,0,.10); }
        .input { width: 100%; padding: 14px 16px; border: 1.5px solid #e5e7eb; border-radius: 11px;
            font-size: 15px; outline: none; transition: border-color .18s, background .18s; background: #f9fafb; font-family: inherit; }
        .input:focus { border-color: #2563eb; background: #fff; }
        .input[aria-invalid="true"] { border-color: #dc2626; background: #fff5f5; }
        .input-pwd { padding-right: 48px; }
        .btn { width: 100%; padding: 15px; background: #2563eb; color: #fff; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: background .18s; font-family: inherit; }
        .btn:hover:not(:disabled) { background: #1d4ed8; }
        .btn:disabled { background: #93c5fd; cursor: not-allowed; }
        .err { display: none; color: #dc2626; font-size: 12px; margin: 5px 0 0; }
        .err.show { display: block; }
        .alert { display: none; border-radius: 10px; padding: 11px 14px; font-size: 13px; margin-bottom: 14px; }
        .alert.show { display: block; }
        .alert-err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
        .alert-ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
        .eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none;
            border: none; cursor: pointer; color: #9ca3af; padding: 4px; font-size: 18px; }
        .eye:hover { color: #4b5563; }
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-black text-white">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/starlink/" class="flex items-center gap-2" aria-label="Starlink Reseller Kenya home">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="30" height="30" aria-hidden="true"><ellipse cx="100" cy="100" rx="74" ry="55" stroke="white" stroke-width="10" fill="none" transform="rotate(-25 100 100)"/><ellipse cx="100" cy="100" rx="43" ry="33" stroke="white" stroke-width="10" fill="none" transform="rotate(65 100 100)"/><circle cx="100" cy="100" r="12" fill="white"/></svg>
                <span class="font-bold text-lg tracking-widest">STARLINK</span>
                <span class="text-xs border-l pl-2 ml-1 border-gray-600 hidden sm:inline text-gray-300">Reseller Kenya</span>
            </a>
            <nav class="flex gap-4 items-center text-sm" aria-label="Main">
                <a href="/starlink/" class="text-gray-300 hover:text-white">Bundles</a>
                <a href="/starlink/register.html" class="font-semibold bg-white text-black px-3 py-1.5 rounded-full hover:bg-gray-200 transition">Sign up</a>
            </nav>
        </div>
    </header>

    <main class="min-h-screen flex items-start sm:items-center justify-center px-4 py-10">
        <div class="bg-white rounded-2xl card-shadow p-7 sm:p-8 w-full max-w-md">
            <h1 class="text-2xl font-black text-gray-900 text-center mb-1">Welcome back</h1>
            <p class="text-gray-500 text-sm text-center mb-7">Log in to manage your Starlink bundles</p>

            <div id="alert" class="alert alert-err" role="alert"></div>

            <form id="form" novalidate>
                <div class="mb-4">
                    <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">Phone number</label>
                    <input id="phone" name="phone" class="input" type="tel" inputmode="numeric"
                           placeholder="0712 345 678" autocomplete="tel-national" maxlength="12" aria-describedby="phoneErr">
                    <p class="err" id="phoneErr" role="alert"></p>
                </div>

                <div class="mb-5">
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <input id="password" name="password" class="input input-pwd" type="password"
                               placeholder="••••••••" autocomplete="current-password" maxlength="128" aria-describedby="passwordErr">
                        <button type="button" class="eye" data-target="password" aria-label="Show password"><i class="uil uil-eye" aria-hidden="true"></i></button>
                    </div>
                    <p class="err" id="passwordErr" role="alert"></p>
                </div>

                <button type="submit" class="btn" id="submitBtn">Log in</button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-6">
                Don't have an account?
                <a href="/starlink/register.html" class="text-blue-600 font-semibold hover:underline ml-1">Sign up</a>
            </p>
        </div>
    </main>

    <footer class="bg-black text-gray-400 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p class="mb-1">Authorised Starlink reseller in Kenya · Pay with Safaricom M-Pesa or Airtel Money</p>
            <p>&copy; 2026 Starlink Reseller Kenya. All rights reserved.</p>
        </div>
    </footer>

<script>
(function () {
    'use strict';

    function $(id) { return document.getElementById(id); }

    function setError(field, message) {
        var input = $(field), err = $(field + 'Err');
        if (!err) return;
        if (message) {
            if (input) input.setAttribute('aria-invalid', 'true');
            err.textContent = message;
            err.classList.add('show');
        } else {
            if (input) input.removeAttribute('aria-invalid');
            err.textContent = '';
            err.classList.remove('show');
        }
    }

    function alertBox(message, kind) {
        var el = $('alert');
        if (!message) { el.classList.remove('show'); return; }
        el.className = 'alert show ' + (kind === 'ok' ? 'alert-ok' : 'alert-err');
        el.textContent = message;
    }

    function validate() {
        var ok = true;
        if (!$('phone').value.trim()) { setError('phone', 'Enter your phone number.'); ok = false; }
        else if (!window.SL.isValidKenyaPhone($('phone').value)) {
            setError('phone', 'Enter a valid Kenyan number, e.g. 0712 345 678.'); ok = false;
        } else setError('phone', '');

        if (!$('password').value) { setError('password', 'Enter your password.'); ok = false; }
        else setError('password', '');

        return ok;
    }

    async function submit(e) {
        e.preventDefault();
        alertBox('');
        if (!validate()) return;

        var btn = $('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Logging in…';

        var res = await window.SL.api('/api/starlink/login', {
            method: 'POST',
            csrf: true,
            body: {
                phone: window.SL.normalizeKenyaPhone($('phone').value),
                password: $('password').value
            }
        }).catch(function () { return { ok: false, data: {} }; });

        btn.disabled = false;
        btn.textContent = 'Log in';

        if (!res.ok || !res.data.success) {
            var field = res.data.field;
            if (field && field !== 'form' && $(field + 'Err')) setError(field, res.data.message);
            else alertBox(res.data.message || 'We could not log you in. Please try again.');
            $('password').value = '';
            return;
        }

        window.SL.setUser(res.data.user);
        alertBox('Logged in. Redirecting…', 'ok');
        var redirect = new URLSearchParams(location.search).get('redirect');
        // Only allow same-origin relative paths — blocks open-redirect abuse.
        var target = (redirect && /^\/[A-Za-z0-9\-._~/]*$/.test(redirect)) ? redirect : '/starlink/';
        setTimeout(function () { location.href = target; }, 700);
    }

    document.addEventListener('DOMContentLoaded', function () {
        if (window.SL.getUser()) { location.replace('/starlink/'); return; }

        $('phone').addEventListener('input', function () {
            this.value = window.SL.formatKenyaPhoneInput(this.value);
            setError('phone', '');
        });
        $('password').addEventListener('input', function () { setError('password', ''); });

        Array.prototype.forEach.call(document.querySelectorAll('.eye'), function (btn) {
            btn.addEventListener('click', function () {
                var input = $(btn.getAttribute('data-target'));
                var hidden = input.type === 'password';
                input.type = hidden ? 'text' : 'password';
                btn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
                btn.innerHTML = '<i class="uil ' + (hidden ? 'uil-eye-slash' : 'uil-eye') + '" aria-hidden="true"></i>';
            });
        });

        $('form').addEventListener('submit', submit);
    });
})();
</script>
</body>
</html>
